name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
# W8.3: narrowest viable permission set for the documented bot use (PR review
# and @claude-mention assistance).
#
# `id-token: write` is RESTORED after the initial W8.3 pass removed it. The
# action does not exchange OIDC tokens with any *cloud provider* (Claude
# auth uses `CLAUDE_CODE_OAUTH_TOKEN` from repo secrets), but it does call
# GitHub's OIDC endpoint to mint a short-lived GitHub App token that it
# uses for repo/PR operations. Without `id-token: write` every workflow
# run fails at `getOidcToken` with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
# The permission is workflow-scoped and does not grant access to any cloud
# provider on its own.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
jobs:
  claude:
    # W8.3: restrict bot invocation to trusted actor associations so external
    # commenters cannot invoke Claude by @-mention alone. Each event branch
    # also enforces author_association in (OWNER, MEMBER, COLLABORATOR).
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (
          github.event_name == 'pull_request' &&
          (
            github.event.pull_request.author_association == 'OWNER' ||
            github.event.pull_request.author_association == 'MEMBER' ||
            github.event.pull_request.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          (
            github.event.review.author_association == 'OWNER' ||
            github.event.review.author_association == 'MEMBER' ||
            github.event.review.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'issues' &&
          contains(github.event.issue.body, '@claude') &&
          (
            github.event.issue.author_association == 'OWNER' ||
            github.event.issue.author_association == 'MEMBER' ||
            github.event.issue.author_association == 'COLLABORATOR'
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-sonnet-4-6'
